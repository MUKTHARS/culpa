# Culpa Redis: cache (cache-aside, rate limiter) + job stream transport.
# The database outbox is the source of truth, so Redis data loss delays work but never loses it.

bind 0.0.0.0
protected-mode no
port 6379

# Persistence: append-only file, fsync every second (good balance for a queue transport).
appendonly yes
appendfsync everysec
save 900 1
save 300 100

# Memory: cap usage; evict only keys that have a TTL (cache, rate-limit windows), never the job stream.
maxmemory 256mb
maxmemory-policy volatile-lru

# Stream consumers block on XREADGROUP; keep idle client connections.
timeout 0
tcp-keepalive 60

loglevel notice
